name: Classify word-game vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'data/word-game/tbcl-b1-b2-master.json'
      - 'data/word-game/VOCABULARY-SCHEMA.md'
      - 'scripts/classify_word_game_vocab.py'
      - '.github/workflows/classify-word-game-vocab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build assisted classification candidates
        run: python scripts/classify_word_game_vocab.py

      - name: Commit generated classification data
        run: |
          if [ -z "$(git status --porcelain -- data/word-game/word-game-classification-candidates.json data/word-game/CLASSIFICATION-REPORT.md)" ]; then
            echo "No classification changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/word-game/word-game-classification-candidates.json data/word-game/CLASSIFICATION-REPORT.md
          git commit -m "Generate assisted B1-B2 vocabulary classification"
          git push
