name: Refresh word-game TBCL vocabulary

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/refresh_tbcl_vocab.py
      - .github/workflows/refresh-word-game-vocab.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Build B1-B2 master vocabulary
        run: python scripts/refresh_tbcl_vocab.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/word-game/tbcl-b1-b2-master.csv \
                  data/word-game/tbcl-b1-b2-master.json \
                  data/word-game/tbcl-b1-b2-source.json
          if git diff --cached --quiet; then
            echo "No vocabulary changes."
            exit 0
          fi
          git commit -m "Refresh TBCL B1-B2 vocabulary master"
          git push
