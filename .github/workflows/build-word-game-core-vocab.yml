name: Build word-game core vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'data/word-game/tbcl-b1-b2-master.json'
      - 'scripts/build_word_game_core_vocab.py'
      - '.github/workflows/build-word-game-core-vocab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build core vocabulary shortlist
        run: python scripts/build_word_game_core_vocab.py

      - name: Commit generated shortlist
        run: |
          if [ -z "$(git status --porcelain -- data/word-game/core-vocab-v0.1.json data/word-game/CORE-VOCAB-v0.1.md)" ]; then
            echo "No core vocabulary changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/word-game/core-vocab-v0.1.json data/word-game/CORE-VOCAB-v0.1.md
          git commit -m "Generate tutorial-adjacent core vocabulary shortlist"
          git push
