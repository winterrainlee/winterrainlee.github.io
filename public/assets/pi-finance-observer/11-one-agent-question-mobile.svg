<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720"><style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.l{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5}.a{fill:#eef2ff;stroke:#818cf8;stroke-width:1.7}.ln{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="38" class="t">하나의 에이전트가 다 하면?</text><rect x="55" y="75" width="310" height="95" rx="14" class="a"/><text x="210" y="105" text-anchor="middle" class="l">하나의 에이전트</text><text x="210" y="129" text-anchor="middle" class="s">기록 + 상태관리 + 분석</text><line x1="210" y1="170" x2="210" y2="215" class="ln"/><rect x="55" y="215" width="310" height="105" rx="14" class="b"/><text x="210" y="245" text-anchor="middle" class="l">자연어 이해</text><text x="210" y="269" text-anchor="middle" class="s">애매함·누락·문맥</text><line x1="210" y1="320" x2="210" y2="360" class="ln"/><rect x="55" y="360" width="310" height="105" rx="14" class="b"/><text x="210" y="390" text-anchor="middle" class="l">장부 실행</text><text x="210" y="414" text-anchor="middle" class="s">형식·계산·파일 수정</text><line x1="210" y1="465" x2="210" y2="505" class="ln"/><rect x="55" y="505" width="310" height="105" rx="14" class="b"/><text x="210" y="535" text-anchor="middle" class="l">장기 분석</text><text x="210" y="559" text-anchor="middle" class="s">과거 상태·요약</text><text x="210" y="670" text-anchor="middle" class="s">실패 원인이 섞여버린다.</text></svg>