<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
<style>
  .title { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .label { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .small { font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
  .tiny { font: 500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4B5563; }
  .box { fill:#F9FAFB; stroke:#D1D5DB; stroke-width:1.5; rx:14; }
  .accent { fill:#EEF2FF; stroke:#818CF8; stroke-width:1.8; rx:14; }
  .green { fill:#ECFDF5; stroke:#34D399; stroke-width:1.8; rx:14; }
  .amber { fill:#FFFBEB; stroke:#F59E0B; stroke-width:1.8; rx:14; }
  .rose { fill:#FFF1F2; stroke:#FB7185; stroke-width:1.8; rx:14; }
  .arrow { stroke:#6B7280; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42">Fresh phase를 거쳐 도달한 최종 구조</text>
<text class="small" x="40" y="68">명확한 요청은 코드로, 애매한 요청은 Gemma 26B로 보낸다.</text>
<rect class="accent" x="70" y="140" width="180" height="90" rx="14"/><text class="label" x="160" y="168" text-anchor="middle">사용자 입력</text><text class="small" x="160" y="192" text-anchor="middle">자유로운 자연어</text>
<rect class="green" x="320" y="120" width="200" height="130" rx="14"/><text class="label" x="420" y="148" text-anchor="middle">Deterministic Gate</text><text class="small" x="420" y="172" text-anchor="middle">명확·완전·닫힌 표면인가?</text><text class="small" x="420" y="190" text-anchor="middle">애매함/누락/문맥 여부 확인</text>
<rect class="amber" x="620" y="70" width="250" height="110" rx="14"/><text class="label" x="745" y="98" text-anchor="middle">Deterministic Fast Path</text><text class="small" x="745" y="122" text-anchor="middle">명확한 거래는 코드로 바로 처리</text><text class="small" x="745" y="140" text-anchor="middle">parser → normalizer → core</text>
<rect class="rose" x="620" y="240" width="250" height="130" rx="14"/><text class="label" x="745" y="268" text-anchor="middle">Gemma 4 26B-A4B</text><text class="small" x="745" y="292" text-anchor="middle">애매한 입력 해석</text><text class="small" x="745" y="310" text-anchor="middle">누락 정보 발견</text><text class="small" x="745" y="328" text-anchor="middle">질문/문맥/상대시간 처리</text>
<rect class="box" x="620" y="410" width="250" height="70" rx="14"/><text class="label" x="745" y="438" text-anchor="middle">Deterministic Finance Core</text><text class="small" x="745" y="462" text-anchor="middle">상태 변경 / 잔액 / 검증</text>
<line class="arrow" x1="250" y1="185" x2="320" y2="185"/><line class="arrow" x1="520" y1="155" x2="620" y2="125"/><text class="tiny" x="570" y="130" text-anchor="middle">명확함</text><line class="arrow" x1="520" y1="215" x2="620" y2="285"/><text class="tiny" x="570" y="240" text-anchor="middle">애매함</text><line class="arrow" x1="745" y1="180" x2="745" y2="410"/><text class="tiny" x="745" y="285" text-anchor="middle">commit</text><line class="arrow" x1="745" y1="370" x2="745" y2="410"/><text class="tiny" x="745" y="380" text-anchor="middle">resolved action</text>
<rect class="box" x="70" y="340" width="450" height="110" rx="14"/><text class="label" x="295" y="368" text-anchor="middle">핵심 결론</text><text class="small" x="295" y="392" text-anchor="middle">Tiny SLM을 따로 두기보다,</text><text class="small" x="295" y="410" text-anchor="middle">코드가 잘하는 구간과 Gemma가 필요한 구간을 분리하는 편이 더 단순하고 안정적이었다.</text>
</svg>