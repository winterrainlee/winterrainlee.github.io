<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
<style>
.title{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.small{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}
.tiny{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4B5563}
.box{fill:#F9FAFB;stroke:#D1D5DB;stroke-width:1.5}
.green{fill:#ECFDF5;stroke:#34D399;stroke-width:1.8}
.amber{fill:#FFFBEB;stroke:#F59E0B;stroke-width:1.8}
.rose{fill:#FFF1F2;stroke:#FB7185;stroke-width:1.8}
.arrow{stroke:#6B7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42" text-anchor="start">현재 구조는 “자율 LLM 하나”보다 hybrid agentic workflow에 가깝다</text>
<text class="small" x="40" y="68" text-anchor="start">결정 가능한 구간은 workflow가 고정하고, 판단이 필요한 구간만 semantic controller에게 넘긴다.</text>
<rect class="green" x="80" y="145" width="230" height="120" rx="14"/><text class="label" x="195" y="174" text-anchor="middle">Deterministic Workflow</text><text class="small" x="195" y="199" text-anchor="middle">gate</text><text class="small" x="195" y="218" text-anchor="middle">known rules</text><text class="small" x="195" y="237" text-anchor="middle">safe fast path</text>
<rect class="rose" x="375" y="145" width="230" height="120" rx="14"/><text class="label" x="490" y="174" text-anchor="middle">Semantic LLM</text><text class="small" x="490" y="199" text-anchor="middle">ambiguity</text><text class="small" x="490" y="218" text-anchor="middle">missing/context</text><text class="small" x="490" y="237" text-anchor="middle">clarification</text>
<rect class="amber" x="670" y="145" width="230" height="120" rx="14"/><text class="label" x="785" y="174" text-anchor="middle">State / Tools</text><text class="small" x="785" y="199" text-anchor="middle">validated commit</text><text class="small" x="785" y="218" text-anchor="middle">balance</text><text class="small" x="785" y="237" text-anchor="middle">persistent ledger</text>
<line class="arrow" x1="310" y1="205" x2="375" y2="205"/><text class="tiny" x="342.5" y="197" text-anchor="middle">판단 필요</text><line class="arrow" x1="605" y1="205" x2="670" y2="205"/><text class="tiny" x="637.5" y="197" text-anchor="middle">resolved action</text>
<rect class="box" x="245" y="320" width="490" height="55" rx="14"/><text class="label" x="490" y="349" text-anchor="middle">책임 원칙</text><text class="small" x="490" y="374" text-anchor="middle">LLM은 인간 언어의 경계, 코드는 상태와 불변식.</text>
</svg>