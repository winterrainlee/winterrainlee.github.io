<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500"><style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.l{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.g{fill:#ecfdf5;stroke:#34d399;stroke-width:1.7}.r{fill:#fff1f2;stroke:#fb7185;stroke-width:1.7}.ln{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="40" y="42" class="t">관찰하려면 먼저 시스템을 단순하게 만들어야 했다</text><rect x="55" y="105" width="360" height="250" rx="14" class="r"/><text x="235" y="135" text-anchor="middle" class="l">실제 운영 환경: OpenClaw</text><text x="235" y="159" text-anchor="middle" class="s">memory</text><text x="235" y="178" text-anchor="middle" class="s">skills</text><text x="235" y="197" text-anchor="middle" class="s">여러 tools</text><text x="235" y="216" text-anchor="middle" class="s">긴 context</text><text x="235" y="235" text-anchor="middle" class="s">session / state</text><text x="235" y="254" text-anchor="middle" class="s">실제 파일과 운영 규칙</text><rect x="585" y="130" width="360" height="200" rx="14" class="g"/><text x="765" y="160" text-anchor="middle" class="l">실험 환경: Pi</text><text x="765" y="184" text-anchor="middle" class="s">fresh session</text><text x="765" y="203" text-anchor="middle" class="s">최소 tool surface</text><text x="765" y="222" text-anchor="middle" class="s">synthetic ledger</text><text x="765" y="241" text-anchor="middle" class="s">CSV / JSON / Markdown</text><text x="765" y="260" text-anchor="middle" class="s">변수 수를 줄여 실패 위치 관찰</text><line x1="415" y1="230" x2="585" y2="230" class="ln"/><text x="500" y="222" text-anchor="middle" class="s">단순화</text><text x="500" y="430" text-anchor="middle" class="s">Pi를 택한 이유는 더 우수해서가 아니라, 관찰해야 할 변수를 줄이기 위해서였다.</text></svg>