<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" role="img">

<style>
  .title{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
  .label{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
  .body{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}
  .tiny{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4B5563}
  .box{fill:#F9FAFB;stroke:#D1D5DB;stroke-width:1.4}
  .accent{fill:#EEF2FF;stroke:#818CF8;stroke-width:1.6}
  .green{fill:#ECFDF5;stroke:#34D399;stroke-width:1.6}
  .amber{fill:#FFFBEB;stroke:#F59E0B;stroke-width:1.6}
  .rose{fill:#FFF1F2;stroke:#FB7185;stroke-width:1.6}
  .arrow{stroke:#6B7280;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="20" y="32">Observer는 에이전트 밖에 둔다</text>
<text class="tiny" x="20" y="54">업무와 관찰을 분리</text>
<rect class="accent" x="55" y="90" width="250" height="100" rx="14"/>
<text class="label" x="180" y="120" text-anchor="middle">에이전트</text>
<text class="body" x="180" y="145" text-anchor="middle">원래 업무만 수행</text>
<text class="body" x="180" y="165" text-anchor="middle">자기평가 보고서는 요구하지 않음</text>
<line class="arrow" x1="180" y1="190" x2="180" y2="235"/>
<text class="tiny" x="195" y="218" text-anchor="start">실제 행동</text>
<rect class="green" x="45" y="235" width="270" height="105" rx="14"/>
<text class="label" x="180" y="265" text-anchor="middle">관찰 가능한 흔적</text>
<text class="body" x="180" y="290" text-anchor="middle">tool trajectory</text>
<text class="body" x="180" y="312" text-anchor="middle">장부 · 파일 상태</text>
<line class="arrow" x1="180" y1="340" x2="180" y2="385"/>
<rect class="amber" x="55" y="385" width="250" height="110" rx="14"/>
<text class="label" x="180" y="415" text-anchor="middle">Observer</text>
<text class="body" x="180" y="440" text-anchor="middle">행동을 복사해 기록</text>
<text class="body" x="180" y="462" text-anchor="middle">판정은 사후에 외부에서</text>
<line class="arrow" x1="180" y1="495" x2="180" y2="535"/>
<rect class="rose" x="45" y="535" width="270" height="85" rx="14"/>
<text class="label" x="180" y="565" text-anchor="middle">핵심 원칙</text>
<text class="body" x="180" y="590" text-anchor="middle">관찰이 에이전트 행동을 바꾸지 않게</text>
</svg>