<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420"><style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.l{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5}.a{fill:#eef2ff;stroke:#818cf8;stroke-width:1.7}.g{fill:#ecfdf5;stroke:#34d399;stroke-width:1.7}.m{fill:#fff7ed;stroke:#fb923c;stroke-width:1.7}.r{fill:#fff1f2;stroke:#fb7185;stroke-width:1.7}.ln{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="40" y="42" class="t">왜 일반 가계부 입력이 나에게는 번거로운가</text><rect x="50" y="105" width="190" height="210" rx="14" class="b"/><text x="145" y="135" text-anchor="middle" class="l">일반 가계부</text><text x="145" y="159" text-anchor="middle" class="s">앱 열기</text><text x="145" y="178" text-anchor="middle" class="s">거래 유형 선택</text><text x="145" y="197" text-anchor="middle" class="s">계좌 선택</text><text x="145" y="216" text-anchor="middle" class="s">카테고리 선택</text><text x="145" y="235" text-anchor="middle" class="s">금액 입력</text><text x="145" y="254" text-anchor="middle" class="s">메모</text><rect x="395" y="145" width="190" height="125" rx="14" class="a"/><text x="490" y="175" text-anchor="middle" class="l">내가 원하는 입력</text><text x="490" y="199" text-anchor="middle" class="s">“점심 현금 120원”</text><text x="490" y="218" text-anchor="middle" class="s">한 문장으로 끝</text><rect x="740" y="145" width="190" height="125" rx="14" class="g"/><text x="835" y="175" text-anchor="middle" class="l">개인 장부</text><text x="835" y="199" text-anchor="middle" class="s">거래 기록</text><text x="835" y="218" text-anchor="middle" class="s">잔액 반영</text><line x1="240" y1="210" x2="395" y2="210" class="ln"/><text x="317.5" y="202" text-anchor="middle" class="s">입력 friction 줄이기</text><line x1="585" y1="210" x2="740" y2="210" class="ln"/><text x="490" y="365" text-anchor="middle" class="s">매일 반복하는 작은 기록일수록 입력 비용이 조금만 높아도 결국 기록을 빼먹게 된다.</text></svg>