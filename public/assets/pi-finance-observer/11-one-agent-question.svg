<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"><style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.l{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5}.a{fill:#eef2ff;stroke:#818cf8;stroke-width:1.7}.ln{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="40" y="42" class="t">그럼 이걸 에이전트 하나가 다 하면 안 될까?</text><rect x="60" y="150" width="190" height="105" rx="14" class="a"/><text x="155" y="180" text-anchor="middle" class="l">하나의 에이전트</text><text x="155" y="204" text-anchor="middle" class="s">기록</text><text x="155" y="223" text-anchor="middle" class="s">상태관리</text><text x="155" y="242" text-anchor="middle" class="s">분석</text><rect x="350" y="110" width="150" height="185" rx="14" class="b"/><text x="425" y="140" text-anchor="middle" class="l">자연어 이해</text><text x="425" y="164" text-anchor="middle" class="s">애매함·누락</text><rect x="590" y="110" width="150" height="185" rx="14" class="b"/><text x="665" y="140" text-anchor="middle" class="l">장부 실행</text><text x="665" y="164" text-anchor="middle" class="s">형식·계산·수정</text><rect x="830" y="110" width="150" height="185" rx="14" class="b"/><text x="905" y="140" text-anchor="middle" class="l">장기 분석</text><text x="905" y="164" text-anchor="middle" class="s">과거 상태·요약</text><line x1="250" y1="200" x2="350" y2="200" class="ln"/><line x1="250" y1="200" x2="590" y2="200" class="ln"/><line x1="250" y1="200" x2="830" y2="200" class="ln"/><text x="520" y="390" text-anchor="middle" class="s">한 번에 묶으면 실패가 났을 때 무엇이 원인인지 알기 어려워진다.</text></svg>