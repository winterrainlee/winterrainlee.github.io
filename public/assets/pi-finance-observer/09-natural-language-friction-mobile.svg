<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650"><style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.l{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5}.a{fill:#eef2ff;stroke:#818cf8;stroke-width:1.7}.g{fill:#ecfdf5;stroke:#34d399;stroke-width:1.7}.ln{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="38" class="t">자연어로 돈 정리하고 싶다</text><rect x="55" y="75" width="310" height="185" rx="14" class="b"/><text x="210" y="105" text-anchor="middle" class="l">일반 가계부</text><text x="210" y="129" text-anchor="middle" class="s">앱 열기 → 거래 유형</text><text x="210" y="148" text-anchor="middle" class="s">계좌 → 카테고리</text><text x="210" y="167" text-anchor="middle" class="s">금액 → 메모</text><line x1="210" y1="260" x2="210" y2="315" class="ln"/><text x="210" y="280" text-anchor="middle" class="s">줄이고 싶다</text><rect x="55" y="315" width="310" height="110" rx="14" class="a"/><text x="210" y="345" text-anchor="middle" class="l">한 문장</text><text x="210" y="369" text-anchor="middle" class="s">“점심 현금 120원”</text><text x="210" y="388" text-anchor="middle" class="s">말하고 끝</text><line x1="210" y1="425" x2="210" y2="480" class="ln"/><rect x="55" y="480" width="310" height="110" rx="14" class="g"/><text x="210" y="510" text-anchor="middle" class="l">개인 장부</text><text x="210" y="534" text-anchor="middle" class="s">거래 기록</text><text x="210" y="553" text-anchor="middle" class="s">잔액 반영</text></svg>