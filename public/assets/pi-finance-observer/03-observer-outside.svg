<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470">
<style>
.title{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.small{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}
.tiny{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4B5563}
.box{fill:#F9FAFB;stroke:#D1D5DB;stroke-width:1.5}
.accent{fill:#EEF2FF;stroke:#818CF8;stroke-width:1.8}
.green{fill:#ECFDF5;stroke:#34D399;stroke-width:1.8}
.amber{fill:#FFFBEB;stroke:#F59E0B;stroke-width:1.8}
.rose{fill:#FFF1F2;stroke:#FB7185;stroke-width:1.8}
.arrow{stroke:#6B7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42" text-anchor="start">Observer는 에이전트 밖에 둔다</text>
<text class="small" x="40" y="68" text-anchor="start">에이전트에게 자기평가를 시키지 않고, 실제 행동을 외부에서 수집해 사후 판정한다.</text>
<rect class="accent" x="70" y="135" width="210" height="100" rx="14"/><text class="label" x="175" y="164" text-anchor="middle">사용자 요청</text><text class="small" x="175" y="189" text-anchor="middle">원래 finance 업무</text>
<rect class="green" x="360" y="115" width="230" height="140" rx="14"/><text class="label" x="475" y="144" text-anchor="middle">에이전트</text><text class="small" x="475" y="169" text-anchor="middle">입력 해석</text><text class="small" x="475" y="188" text-anchor="middle">tool 사용</text><text class="small" x="475" y="207" text-anchor="middle">장부 변경</text><text class="small" x="475" y="226" text-anchor="middle">종료</text>
<rect class="amber" x="690" y="115" width="220" height="140" rx="14"/><text class="label" x="800" y="144" text-anchor="middle">실제 행동</text><text class="small" x="800" y="169" text-anchor="middle">tool trajectory</text><text class="small" x="800" y="188" text-anchor="middle">파일 상태</text><text class="small" x="800" y="207" text-anchor="middle">validator 결과</text>
<line class="arrow" x1="280" y1="185" x2="360" y2="185"/><line class="arrow" x1="590" y1="185" x2="690" y2="185"/>
<rect class="rose" x="330" y="330" width="320" height="95" rx="14"/><text class="label" x="490" y="359" text-anchor="middle">외부 Observer</text><text class="small" x="490" y="384" text-anchor="middle">행동을 복사해 보존</text><text class="small" x="490" y="403" text-anchor="middle">hidden expected와 비교</text><text class="small" x="490" y="422" text-anchor="middle">earliest divergence / recovery 판정</text>
<line class="arrow" x1="800" y1="255" x2="650" y2="340"/><line class="arrow" x1="465" y1="255" x2="465" y2="330"/>
<text class="label" x="490" y="445" text-anchor="middle">핵심: 관찰을 위해 에이전트의 업무를 바꾸지 않는다.</text>
</svg>