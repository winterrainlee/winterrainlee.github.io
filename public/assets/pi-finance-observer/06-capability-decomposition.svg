<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<style>
.title{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}
.small{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}
.box{fill:#F9FAFB;stroke:#D1D5DB;stroke-width:1.5}
.accent{fill:#EEF2FF;stroke:#818CF8;stroke-width:1.8}
.green{fill:#ECFDF5;stroke:#34D399;stroke-width:1.8}
.amber{fill:#FFFBEB;stroke:#F59E0B;stroke-width:1.8}
.rose{fill:#FFF1F2;stroke:#FB7185;stroke-width:1.8}
.arrow{stroke:#6B7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42" text-anchor="start">“에이전트 성공”이라는 한 덩어리를 쪼개기</text>
<text class="small" x="40" y="68" text-anchor="start">최종 PASS/FAIL 대신 서로 다른 능력과 실패 지점을 따로 본다.</text>
<rect class="accent" x="375" y="100" width="250" height="80" rx="14"/><text class="label" x="500" y="129" text-anchor="middle">Agent Success</text><text class="small" x="500" y="154" text-anchor="middle">최종 상태 하나만으로는 부족</text>
<rect class="green" x="55" y="270" width="190" height="125" rx="14"/><text class="label" x="150" y="299" text-anchor="middle">의미 판단</text><text class="small" x="150" y="324" text-anchor="middle">ambiguity</text><text class="small" x="150" y="343" text-anchor="middle">missing info</text><text class="small" x="150" y="362" text-anchor="middle">clarification</text><line class="arrow" x1="500" y1="180" x2="150" y2="270"/>
<rect class="amber" x="295" y="270" width="190" height="125" rx="14"/><text class="label" x="390" y="299" text-anchor="middle">인터페이스 수행</text><text class="small" x="390" y="324" text-anchor="middle">representation</text><text class="small" x="390" y="343" text-anchor="middle">serialization</text><text class="small" x="390" y="362" text-anchor="middle">tool schema</text><line class="arrow" x1="500" y1="180" x2="390" y2="270"/>
<rect class="rose" x="535" y="270" width="190" height="125" rx="14"/><text class="label" x="630" y="299" text-anchor="middle">상태 변화</text><text class="small" x="630" y="324" text-anchor="middle">arithmetic</text><text class="small" x="630" y="343" text-anchor="middle">balance</text><text class="small" x="630" y="362" text-anchor="middle">mutation</text><line class="arrow" x1="500" y1="180" x2="630" y2="270"/>
<rect class="box" x="755" y="270" width="190" height="125" rx="14"/><text class="label" x="850" y="299" text-anchor="middle">완료 과정</text><text class="small" x="850" y="324" text-anchor="middle">recovery</text><text class="small" x="850" y="343" text-anchor="middle">termination</text><text class="small" x="850" y="362" text-anchor="middle">validator use</text><line class="arrow" x1="500" y1="180" x2="850" y2="270"/>
<text class="label" x="500" y="465" text-anchor="middle">독립 수행 능력 ≠ 도움을 받은 복구 능력 ≠ 최종 결과</text>
</svg>