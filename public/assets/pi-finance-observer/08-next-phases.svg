<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
<style>
  .title { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .label { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .small { font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
  .box { fill:#F9FAFB; stroke:#D1D5DB; stroke-width:1.5; rx:14; }
  .accent { fill:#EEF2FF; stroke:#818CF8; stroke-width:1.8; rx:14; }
  .green { fill:#ECFDF5; stroke:#34D399; stroke-width:1.8; rx:14; }
  .amber { fill:#FFFBEB; stroke:#F59E0B; stroke-width:1.8; rx:14; }
  .arrow { stroke:#6B7280; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42">앞으로의 전개: Capture → State → Insight</text>
<text class="small" x="40" y="68">Fresh phase 다음에는 persistent state와 분석 단계로 넘어간다.</text>
<rect class="accent" x="70" y="150" width="230" height="150" rx="14"/><text class="label" x="185" y="178" text-anchor="middle">Capture</text><text class="small" x="185" y="202" text-anchor="middle">"이 입력은 무슨 거래인가?"</text><text class="small" x="185" y="220" text-anchor="middle">gate + fast path + Gemma 26B</text><text class="small" x="185" y="238" text-anchor="middle">fresh transaction capture</text>
<rect class="green" x="375" y="150" width="230" height="150" rx="14"/><text class="label" x="490" y="178" text-anchor="middle">State</text><text class="small" x="490" y="202" text-anchor="middle">"그래서 지금 얼마가 남았는가?"</text><text class="small" x="490" y="220" text-anchor="middle">잔액 반영 · carry-forward</text><text class="small" x="490" y="238" text-anchor="middle">daily close · threshold alert</text>
<rect class="amber" x="680" y="150" width="230" height="150" rx="14"/><text class="label" x="795" y="178" text-anchor="middle">Insight</text><text class="small" x="795" y="202" text-anchor="middle">"이 기록은 무엇을 의미하는가?"</text><text class="small" x="795" y="220" text-anchor="middle">주간/월간 집계</text><text class="small" x="795" y="238" text-anchor="middle">요약 · 질의응답</text>
<line class="arrow" x1="300" y1="225" x2="375" y2="225"/><line class="arrow" x1="605" y1="225" x2="680" y2="225"/>
<rect class="box" x="190" y="330" width="600" height="60" rx="14"/><text class="label" x="490" y="358" text-anchor="middle">다음 단계의 초점</text><text class="small" x="490" y="382" text-anchor="middle">v0.8~v0.10: 거래가 누적될 때 상태가 정확히 이어지는가를 먼저 검증</text>
</svg>