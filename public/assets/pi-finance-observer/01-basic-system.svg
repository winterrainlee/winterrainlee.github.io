<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<style>
  .title { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .label { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .small { font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
  .tiny { font: 500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4B5563; }
  .box { fill:#F9FAFB; stroke:#D1D5DB; stroke-width:1.5; rx:14; }
  .accent { fill:#EEF2FF; stroke:#818CF8; stroke-width:1.8; rx:14; }
  .green { fill:#ECFDF5; stroke:#34D399; stroke-width:1.8; rx:14; }
  .amber { fill:#FFFBEB; stroke:#F59E0B; stroke-width:1.8; rx:14; }
  .rose { fill:#FFF1F2; stroke:#FB7185; stroke-width:1.8; rx:14; }
  .arrow { stroke:#6B7280; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dashed { stroke-dasharray:6 6; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
  </marker>
</defs>
<text class="title" x="40" y="42">기본 생활비 시스템</text>
<text class="small" x="40" y="68">현금 · 교통카드(EasyCard) · 은행카드/여행카드가 어떻게 연결되는지</text>
<rect class="green" x="60" y="110" width="210" height="120" rx="14"/>
<text class="label" x="165" y="138" text-anchor="middle">현금</text>
<text class="small" x="165" y="162" text-anchor="middle">일상 지출</text>
<text class="small" x="165" y="180" text-anchor="middle">EasyCard 충전 원천</text>
<text class="small" x="165" y="198" text-anchor="middle">부족하면 바로 불편해짐</text>
<rect class="accent" x="355" y="110" width="210" height="120" rx="14"/>
<text class="label" x="460" y="138" text-anchor="middle">교통카드 / EasyCard</text>
<text class="small" x="460" y="162" text-anchor="middle">버스·지하철·소액 결제</text>
<text class="small" x="460" y="180" text-anchor="middle">현금으로 충전</text>
<text class="small" x="460" y="198" text-anchor="middle">잔액 부족 시 이동이 곤란</text>
<rect class="amber" x="650" y="110" width="210" height="120" rx="14"/>
<text class="label" x="755" y="138" text-anchor="middle">은행카드 / 여행카드</text>
<text class="small" x="755" y="162" text-anchor="middle">비교적 큰 잔액 저장</text>
<text class="small" x="755" y="180" text-anchor="middle">ATM 인출 가능</text>
<text class="small" x="755" y="198" text-anchor="middle">현금의 원천 계좌</text>
<line class="arrow" x1="270" y1="170" x2="355" y2="170"/>
<text class="tiny" x="312.5" y="162" text-anchor="middle">현금으로 충전</text>
<line class="arrow" x1="650" y1="170" x2="565" y2="170"/>
<text class="tiny" x="607.5" y="162" text-anchor="middle">ATM 인출</text>
<line class="arrow" x1="165" y1="230" x2="165" y2="315"/>
<text class="tiny" x="165" y="272.5" text-anchor="middle">현금 지출</text>
<line class="arrow" x1="460" y1="230" x2="460" y2="315"/>
<text class="tiny" x="460" y="272.5" text-anchor="middle">교통/소액 결제</text>
<rect class="rose" x="235" y="315" width="390" height="80" rx="14"/>
<text class="label" x="430" y="343" text-anchor="middle">왜 이 둘이 중요했나?</text>
<text class="small" x="430" y="367" text-anchor="middle">현금과 EasyCard는 도중에 비면 바로 생활이 불편해진다.</text>
<text class="small" x="430" y="385" text-anchor="middle">그래서 거래를 기록할 때마다 잔액을 즉시 확인하고 싶었다.</text>
</svg>