<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
<style>
  .title { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .label { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
  .small { font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
  .tiny { font: 500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4B5563; }
  .box { fill:#F9FAFB; stroke:#D1D5DB; stroke-width:1.5; rx:14; }
  .accent { fill:#EEF2FF; stroke:#818CF8; stroke-width:1.8; rx:14; }
  .green { fill:#ECFDF5; stroke:#34D399; stroke-width:1.8; rx:14; }
  .amber { fill:#FFFBEB; stroke:#F59E0B; stroke-width:1.8; rx:14; }
  .rose { fill:#FFF1F2; stroke:#FB7185; stroke-width:1.8; rx:14; }
  .arrow { stroke:#6B7280; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7280"/></marker></defs>
<text class="title" x="40" y="42">내가 보고 싶었던 것: 무엇을 분리해야 하는가</text>
<text class="small" x="40" y="68">"모델이 틀렸다"만으로는 부족했다. 어디서 틀렸는지 알고 싶었다.</text>
<rect class="accent" x="70" y="120" width="180" height="90" rx="14"/><text class="label" x="160" y="148" text-anchor="middle">사용자 입력</text><text class="small" x="160" y="172" text-anchor="middle">예: "카드로 점심 150원"</text>
<rect class="green" x="310" y="100" width="180" height="130" rx="14"/><text class="label" x="400" y="128" text-anchor="middle">의미 판단</text><text class="small" x="400" y="152" text-anchor="middle">무슨 거래인가?</text><text class="small" x="400" y="170" text-anchor="middle">정보가 충분한가?</text><text class="small" x="400" y="188" text-anchor="middle">질문이 필요한가?</text>
<rect class="amber" x="540" y="100" width="180" height="130" rx="14"/><text class="label" x="630" y="128" text-anchor="middle">실행 / 표현</text><text class="small" x="630" y="152" text-anchor="middle">올바른 tool 선택</text><text class="small" x="630" y="170" text-anchor="middle">필드 채우기</text><text class="small" x="630" y="188" text-anchor="middle">형식 맞추기</text>
<rect class="rose" x="770" y="100" width="150" height="130" rx="14"/><text class="label" x="845" y="128" text-anchor="middle">상태 변화</text><text class="small" x="845" y="152" text-anchor="middle">잔액 반영</text><text class="small" x="845" y="170" text-anchor="middle">기록 append</text><text class="small" x="845" y="188" text-anchor="middle">불변식 유지</text>
<line class="arrow" x1="250" y1="165" x2="310" y2="165"/><line class="arrow" x1="490" y1="165" x2="540" y2="165"/><line class="arrow" x1="720" y1="165" x2="770" y2="165"/>
<rect class="box" x="120" y="320" width="230" height="95" rx="14"/><text class="label" x="235" y="348" text-anchor="middle">Observer가 따로 보려 한 것</text><text class="small" x="235" y="372" text-anchor="middle">1) semantic failure</text><text class="small" x="235" y="390" text-anchor="middle">2) interface / serialization failure</text><text class="small" x="235" y="408" text-anchor="middle">3) state mutation failure</text>
<rect class="box" x="390" y="320" width="230" height="95" rx="14"/><text class="label" x="505" y="348" text-anchor="middle">왜 중요했나</text><text class="small" x="505" y="372" text-anchor="middle">최종 실패 하나에 원인이 여러 개 섞이면</text><text class="small" x="505" y="390" text-anchor="middle">모델의 진짜 약점을 알 수 없기 때문</text>
<rect class="box" x="660" y="320" width="230" height="95" rx="14"/><text class="label" x="775" y="348" text-anchor="middle">결론</text><text class="small" x="775" y="372" text-anchor="middle">"더 좋은 모델"보다</text><text class="small" x="775" y="390" text-anchor="middle">"어떤 일을 누구에게 맡길지"가 중요했다</text>
</svg>